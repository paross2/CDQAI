# CDQAI file version: 2.5.1
person_severity:
  enabled: false
  table: "YOUR_DATABASE.YOUR_SCHEMA.YOUR_PERSON_DATA_SOURCE"

review_priority:
  # Set this to the source column representing crash severity.
  severity_field: "YOUR_CRASH_SEVERITY_FIELD"
  severity_codes:
    fatal: ["K"]
    serious_injury: ["A"]
    other_injury: ["B", "C"]
    property_damage: ["O"]
  # Provisional review-policy settings, not calibrated probabilities.
  narrative_priority_weight:
    fatal: 1.0
    serious_injury: 1.0
    other_injury: 0.75
    property_damage: 0.5
    unknown: 1.0
  narrative_completeness_bonus:
    fatal: 1.5
    serious_injury: 1.0
    other_injury: 0.25
    property_damage: 0.0
    unknown: 0.0

analyst_guidance:
  enabled: false
  # Exact installed local Llama tag. No downloads or cloud fallback are performed.
  model: ""
  port: 11434
  # Set true only after an authorized operator disables Ollama cloud and restarts it.
  local_only_confirmed: false
  max_findings: 20
  timeout_seconds: 60

scooter_classifier:
  enabled: false
  # Keep labeled crash data outside the repository and configure this only locally.
  training_file: ""
  training_text_field: "Narrative"
  training_label_field: "Scooter"
  positive_label: "1"
  negative_label: "0"
  confidence_threshold: 0.85
  minimum_validation_precision: 0.50
  random_state: 42
  # Add the source identifiers for the local unit-record data.
  vehicle_tables: []
  vehicle_mfn_field: "YOUR_CRASH_ID_FIELD"
  vehicle_year_field: "YOUR_YEAR_FIELD"
  crash_year_field: "YOUR_CRASH_YEAR_FIELD"
  unit_type_field: "YOUR_UNIT_TYPE_FIELD"
  scooter_unit_type_code: "YOUR_SCOOTER_CODE"

factor_review:
  # Optional. Configure local factor tables before enabling; no source rows are cached.
  enabled: false
  categories:
    human:
      tables: []
      mfn_field: "YOUR_CRASH_ID_FIELD"
      year_field: "YOUR_YEAR_FIELD"
      code_field: "YOUR_HUMAN_FACTOR_CODE_FIELD"
    environmental:
      tables: []
      mfn_field: "YOUR_CRASH_ID_FIELD"
      year_field: "YOUR_YEAR_FIELD"
      code_field: "YOUR_ENVIRONMENTAL_FACTOR_CODE_FIELD"
    vehicle:
      tables: []
      mfn_field: "YOUR_CRASH_ID_FIELD"
      year_field: "YOUR_YEAR_FIELD"
      code_field: "YOUR_VEHICLE_FACTOR_CODE_FIELD"

project:
  name: "Crash Data Quality Artificial Intelligence"
  short_name: "CDQAI"
  version: "2.5.1"
  milestone: "AI Powered Crash Data Anomaly Detector"

paths:
  cache_dir: "cache"
  logs_dir: "logs"
  outputs_dir: "outputs"

runtime:
  environment: "development"
  log_level: "INFO"

database:
  driver: "YOUR_DATABASE_DRIVER"
  server: "YOUR_DATABASE_SERVER"
  trusted_connection: false

tables:
  crash_table: "YOUR_CRASH_DATA_SOURCE"
  narrative_table: "YOUR_NARRATIVE_DATA_SOURCE"

fields:
  crash_mfn_field: "YOUR_CRASH_ID_FIELD"
  normalized_mfn_field: "YOUR_NORMALIZED_CRASH_ID_FIELD"
  narrative_text_field: "YOUR_NARRATIVE_TEXT_FIELD"

cache:
  use_cache: true
  write_cache: true
  merged_dataset_file: "merged_crash_dataset.parquet"
  narrative_embeddings_file: "narrative_embeddings.npy"
  narrative_embedding_index_file: "narrative_embedding_index.json"

outputs:
  sample_rows: 1000
  summary_file: "dataset_summary.csv"
  sample_file: "merged_sample.csv"
  manifest_file: "run_manifest.json"
  model_scores_file: "model_scores.csv"
  top_model_anomalies_file: "top_model_anomalies.csv"
  top_model_anomalies_rows: 1000
  evidence_file: "evidence.csv"
  evidence_summary_file: "evidence_summary.csv"
  findings_file: "findings.csv"
  findings_summary_file: "findings_summary.csv"
  actionable_findings_file: "actionable_findings.csv"
  top_findings_file: "top_findings.csv"
  top_findings_rows: 100
  annual_findings_file: "annual_findings.csv"
  dashboard_file: "dashboard.html"
  dashboard_summary_file: "dashboard_summary.csv"
  finding_evidence_file: "finding_evidence.parquet"

models:
  structured:
    enabled: true
    contamination: 0.02
    random_state: 42
    # Optional reviewed allow-list. Leave empty to use all safe numeric fields.
    include_fields: []
    exclude_fields: []
    exclude_prefixes: ["Context"]
    county_fields: ["YOUR_COUNTY_FIELD"]
    geographic_fields: ["Latitude", "Longitude", "Lat", "Lon", "Long", "GPSLatitude", "GPSLongitude", "XCoordinate", "YCoordinate", "Easting", "Northing"]
    hhmm_time_fields: ["YOUR_TIME_FIELD"]
    identifier_fields: ["YOUR_CRASH_ID_FIELD"]

  narrative:
    enabled: true
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    chunk_overlap_tokens: 32
    sentence_review:
      enabled: true
      max_records: 20
      max_sentences: 12
    batch_size: 256
    contamination: 0.02
    random_state: 42

  ensemble:
    structured_weight: 0.5
    narrative_weight: 0.5

model_evidence:
  structured_percentile: 99.0
  narrative_percentile: 99.0
  ensemble_percentile: 99.5
  high_percentile: 99.75
  critical_percentile: 99.9
  multi_model_minimum: 2

rules:
  enabled: true

  missing_narrative:
    enabled: true

  sparse_narrative:
    enabled: true
    minimum_length: 40

  required_fields:
    enabled: true
    crash:
      - "YOUR_CRASH_ID_FIELD"

  injury_conflict:
    enabled: true
    injury_field_candidates:
      - "YOUR_INJURY_SEVERITY_FIELD"
    no_injury_values:
      - "no injury"
      - "none"
      - "not injured"
      - "property damage only"
      - "pdo"
      - "0"
      - "00"
      - "n"
      - "no"

context:
  kentucky_dvmt:
    enabled: true
    directory: "context/kentucky_dvmt/raw"
    normalized_cache_file: "kentucky_county_dvmt.parquet"
    allow_future_fallback: true
    maximum_year_gap: 3
    fields:
      year_candidates: ["CrashYear", "YR", "Year", "Crash_Year", "YOUR_CRASH_YEAR_FIELD"]
      county_candidates: ["CountyNumber", "County_Number", "CountyNo", "COUNTY", "CNTY", "YOUR_COUNTY_FIELD"]
